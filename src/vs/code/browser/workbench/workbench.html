<!DOCTYPE html>
<html>
	<head>
		<script>
			performance.mark('code/didStartRenderer');
		</script>
		<meta charset="utf-8" />

		<!-- Mobile tweaks -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Code">
		<link rel="apple-touch-icon" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/code-192.png" />

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

		<!-- Workbench Configuration -->
		<meta id="vscode-workbench-web-configuration" data-settings="{{WORKBENCH_WEB_CONFIGURATION}}">

		<!-- Workbench Auth Session -->
		<meta id="vscode-workbench-auth-session" data-settings="{{WORKBENCH_AUTH_SESSION}}">

		<!-- Workbench Icon/Manifest/CSS -->
		<link rel="icon" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/favicon.ico" type="image/x-icon" />
		<link rel="manifest" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/manifest.json" crossorigin="use-credentials" />
		<link rel="stylesheet" href="{{WORKBENCH_WEB_BASE_URL}}/out/vs/code/browser/workbench/workbench.css">

	</head>

	<body aria-label="">
		<div
			id="clarity-startup-overlay"
			style="
				position: fixed;
				inset: 0;
				background: #fafafa;
				display: flex;
				flex-direction: column;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				z-index: 1000;
			"
		>
			<div style="display: flex; align-items: center; justify-content: space-between; padding: 24px 40px; border-bottom: 1px solid #e5e5e5;">
				<div style="font-size: 20px; font-weight: 600; color: #111; letter-spacing: -0.3px;">Clarity</div>
				<button
					id="clarity-goto-vscode"
					style="
						padding: 6px 14px;
						font-size: 13px;
						border-radius: 4px;
						border: 1px solid #ccc;
						background: #0078d4;
						color: white;
						cursor: pointer;
					"
					onclick="window.dispatchEvent(new CustomEvent('clarity:showVSCode'));document.getElementById('clarity-startup-overlay').style.display='none';"
				>
					Take Me To VS Code
				</button>
			</div>
			<div style="flex: 1; display: flex; align-items: center; justify-content: center;">
				<div
					id="clarity-open-folder"
					style="
						display: flex;
						flex-direction: column;
						align-items: center;
						gap: 12px;
						padding: 40px 56px;
						border: 1px solid #e5e5e5;
						border-radius: 12px;
						cursor: pointer;
						transition: border-color 0.15s, box-shadow 0.15s;
					"
					onmouseenter="this.style.borderColor='#ccc';this.style.boxShadow='0 2px 12px rgba(0,0,0,0.06)';"
					onmouseleave="this.style.borderColor='#e5e5e5';this.style.boxShadow='none';"
					onclick="document.getElementById('clarity-startup-overlay').style.display='none';"
				>
					<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
					<div style="font-size: 18px; font-weight: 600; color: #111;">Open a Folder</div>
					<div style="font-size: 14px; color: #888; max-width: 260px; text-align: center; line-height: 1.5;">
						Choose a folder to browse and view your documents in Clarity.
					</div>
				</div>
			</div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script>
		const baseUrl = new URL('{{WORKBENCH_WEB_BASE_URL}}', window.location.origin).toString();
		globalThis._VSCODE_FILE_ROOT = baseUrl + '/out/';
	</script>
	<script>
		performance.mark('code/willLoadWorkbenchMain');
	</script>
	<!-- always ensure built in english NLS messages -->
	<script type="module" src="{{WORKBENCH_NLS_FALLBACK_URL}}"></script>
	<!-- attempt to load NLS messages in case non-english -->
	<script type="module" src="{{WORKBENCH_NLS_URL}}"></script>
	<script type="module" src="{{WORKBENCH_WEB_BASE_URL}}/out/vs/code/browser/workbench/workbench.js"></script>
</html>
