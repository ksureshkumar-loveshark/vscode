<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
				;
				font-src
					'self'
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					amdLoader
					cellRendererEditorText
					collapsedCellPreview
					defaultWorkerFactory
					diffEditorWidget
					diffReview
					domLineBreaksComputer
					dompurify
					editorGhostText
					editorViewLayer
					notebookRenderer
					stickyScrollViewLayer
					tokenizeToString
					notebookChatEditController
					richScreenReaderContent
					chatDebugTokenizer
				;
		"/>

		<!-- Workbench CSS -->
		<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">
	</head>

	<body aria-label="">
		<div
			id="kaushik-startup-overlay"
			style="
				position: fixed;
				inset: 0;
				background: white;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				z-index: 1000;
			"
		>
			<h1
				style="
					margin-bottom: 16px;
					font-size: 32px;
					font-weight: 500;
					color: #111;
				"
			>
				Kaushik's app
			</h1>
			<button
				style="
					padding: 8px 16px;
					font-size: 14px;
					border-radius: 4px;
					border: 1px solid #ccc;
					background: #0078d4;
					color: white;
					cursor: pointer;
				"
				onclick="document.getElementById('kaushik-startup-overlay').style.display = 'none';"
			>
				Take Me To VS Code
			</button>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
