<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
				;
				font-src
					'self'
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					amdLoader
					cellRendererEditorText
					collapsedCellPreview
					defaultWorkerFactory
					diffEditorWidget
					diffReview
					domLineBreaksComputer
					dompurify
					editorGhostText
					editorViewLayer
					notebookRenderer
					stickyScrollViewLayer
					tokenizeToString
					notebookChatEditController
					richScreenReaderContent
					chatDebugTokenizer
				;
		"/>

		<!-- Workbench CSS -->
		<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">
	</head>

	<body aria-label="">
		<div
			id="clarity-startup-overlay"
			style="
				position: fixed;
				inset: 0;
				background: #fafafa;
				display: flex;
				flex-direction: column;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				z-index: 1000;
			"
		>
			<div style="display: flex; align-items: center; justify-content: space-between; padding: 24px 40px; border-bottom: 1px solid #e5e5e5;">
				<div style="font-size: 20px; font-weight: 600; color: #111; letter-spacing: -0.3px;">Clarity</div>
				<button
					id="clarity-goto-vscode"
					style="
						padding: 6px 14px;
						font-size: 13px;
						border-radius: 4px;
						border: 1px solid #ccc;
						background: #0078d4;
						color: white;
						cursor: pointer;
					"
					onclick="window.dispatchEvent(new CustomEvent('clarity:showVSCode'));document.getElementById('clarity-startup-overlay').style.display='none';"
				>
					Take Me To VS Code
				</button>
			</div>
			<div style="flex: 1; display: flex; align-items: center; justify-content: center;">
				<div
					id="clarity-open-folder"
					style="
						display: flex;
						flex-direction: column;
						align-items: center;
						gap: 12px;
						padding: 40px 56px;
						border: 1px solid #e5e5e5;
						border-radius: 12px;
						cursor: pointer;
						transition: border-color 0.15s, box-shadow 0.15s;
					"
					onmouseenter="this.style.borderColor='#ccc';this.style.boxShadow='0 2px 12px rgba(0,0,0,0.06)';"
					onmouseleave="this.style.borderColor='#e5e5e5';this.style.boxShadow='none';"
					onclick="if(window.vscode&&window.vscode.ipcRenderer){window.vscode.ipcRenderer.send('vscode:openFolder');}else{document.getElementById('clarity-startup-overlay').style.display='none';}"
				>
					<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
					<div style="font-size: 18px; font-weight: 600; color: #111;">Open a Folder</div>
					<div style="font-size: 14px; color: #888; max-width: 260px; text-align: center; line-height: 1.5;">
						Choose a folder to browse and view your documents in Clarity.
					</div>
				</div>
			</div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
